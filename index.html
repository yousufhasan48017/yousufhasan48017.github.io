<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Yousuf Hasan — BA AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
body {
  font-family: 'DM Sans', sans-serif;
  background: #0a0a0f;
  color: #f0f0f5;
}

/* Chat UI */
.chat-container {
  max-width: 800px;
  margin: 50px auto;
  background: #12121a;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08);
  padding: 20px;
}

#chatBox {
  height: 400px;
  overflow-y: auto;
  margin-bottom: 15px;
}

.message {
  margin-bottom: 10px;
}

.user {
  color: #7eb3ff;
}

.bot {
  color: #a78bfa;
}

input {
  width: 70%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  background: #4f8ef7;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="chat-container">
  <h2>BA AI Assistant</h2>

  <div id="chatBox"></div>

  <input id="userInput" placeholder="Type your message..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
  const inputField = document.getElementById("userInput");
  const chatBox = document.getElementById("chatBox");
  const message = inputField.value;

  if (!message) return;

  chatBox.innerHTML += `<div class="message user"><b>You:</b> ${message}</div>`;

  try {
    const response = await fetch("fetch("https://yousuf48017.app.n8n.cloud/webhook/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await response.json();

    chatBox.innerHTML += `<div class="message bot"><b>Bot:</b> ${data.reply || JSON.stringify(data)}</div>`;

  } catch (error) {
    chatBox.innerHTML += `<div style="color:red;">Error connecting to AI</div>`;
    console.error(error);
  }

  inputField.value = "";
  chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
